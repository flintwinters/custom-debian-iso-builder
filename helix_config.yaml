# Helix ISO Configuration

iso:
  source: "debian-13.0.0-amd64-netinst.iso"
  workspace: "iso-extract"
  output: "helix-debian-13.iso"

# --- Target System Packages ---
# Packages installed by Debian Installer through the generated preseed.
packages:
  - build-essential
  - binutils
  - python3
  - python3-pip
  - git
  - curl
  - wget
  - micro
  - zsh
  - gcc
  - avahi-daemon
  - nala
  - zip
  - xserver-xorg
  - xwayland
  - sddm
  - plasma-framework
  - plasma-desktop
  - plasma-workspace
  - plasma-workspace-wayland
  - kwin-x11
  - kwin-wayland
  - systemsettings
  - plasma-nm
  - plasma-pa

kwin_scripts:
  - "krohnkite.kwinscript"

wallpaper:
  source: "wallpaper.jpg"

# --- SSH Key Setup ---
# If builder keys are not imported, generate this key type for the install user.
ssh_key:
  type: "ed25519"
  user: "sword"

# --- Installer Configuration ---
# Values used to generate the installer preseed inside the ISO.
preseed:
  # --- Localization ---
  language: "en"
  country: "US"
  locale: "en_US.UTF-8"
  keyboard_map: "us"

  # --- Network ---
  hostname: "helix"
  domain_name: "local"
  load_firmware: true

  # --- User Account ---
  # The default user to be created.
  # The password is supplied by prompt or --install-password at create time.
  root_login: false
  make_user: true
  user_fullname: "sword"
  username: "sword"
  default_shell: "/usr/bin/zsh"
  cleanup_home_files:
    - ".bashrc"
    - ".bash_logout"
    - ".profile"
    - ".bash_history"
  
  # --- Timezone ---
  clock_utc: true
  timezone: "UTC"
  clock_ntp: true
  
  # --- Partitioning ---
  # `lvm` or `regular`
  partitioning_method: "lvm"
  partitioning_size: "max"
  partition_recipe: "atomic"

  # --- File System ---
  filesystem: "ext4"
  mount_style: "uuid"
  remove_existing_raid: true
  remove_existing_lvm: true
  confirm_lvm: true
  confirm_lvm_nooverwrite: true

  confirm_write_new_label: true
  choose_partition: "finish"
  confirm_partitioning: true
  confirm_nooverwrite: true

  # --- APT ---
  apt_use_mirror: true
  mirror_country: "manual"
  mirror_hostname: "deb.debian.org"
  mirror_directory: "/debian"
  mirror_proxy: ""
  apt_non_free: true
  apt_contrib: true
  apt_non_free_firmware: true
  install_recommends: false

  # --- Base Packages ---
  # Packages to be installed during the initial setup.
  base_packages:
    - "curl"
    - "wget"
    - "git"

  # --- Package Selection ---
  tasks:
    - "ssh-server"
  package_upgrade: "full-upgrade"
  update_policy: "unattended-upgrades"
  popularity_contest: false

  # --- Bootloader ---
  grub_only_debian: true
  finish_reboot: true

  # --- Automation ---
  auto_install: true
  installer_priority: "critical"
  debconf_priority: "critical"

  # --- Failure Diagnostics ---
  failure_diagnostics: true
  failure_diagnostics_archive: "/var/log/helix-installer-diagnostics.tar"
  failure_diagnostics_tail_lines: 200

  # --- Custom Debian Installer Entries ---
  # Add raw preseed lines here if a custom installer directive is not modeled above.
  extra: []
